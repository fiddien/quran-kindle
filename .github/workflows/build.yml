# === Builds the books for common screen sizes; a v* tag publishes them as a release ===
name: Build books

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish as this release version, e.g. v1.0.0 (leave empty to only build)"
        required: false
        default: ""
      books:
        description: "Build only these books, e.g. companion,companion-text (leave empty for all)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # === one device failing shouldn't cancel the others ===
      fail-fast: false
      matrix:
        # === paperwhite: 1236x1648 · kindle: 1072x1448 (also Paperwhite 3/4, Kobo Clara) · oasis: 1264x1680 (also Kobo Libra) · kindle-2019: 600x800 ===
        device: [paperwhite, kindle, oasis, kindle-2019]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install fonts and text shaping
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core fonts-liberation libfribidi0
      - name: Install Python packages
        run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: cache
          key: sources-${{ hashFiles('mushaf/sources.py', 'mushaf/textbook.py') }}
      - name: Build image books
        if: inputs.books == ''
        run: python -m mushaf --device ${{ matrix.device }}
      - name: Build text editions (EPUB and PDF)
        if: inputs.books == ''
        run: python -m mushaf --device ${{ matrix.device }} --book mushaf-text,companion-text,translation-text
      - name: Build the chosen books
        if: inputs.books != ''
        env:
          BOOKS: ${{ inputs.books }}
        run: python -m mushaf --device ${{ matrix.device }} --book "$BOOKS"
      - uses: actions/upload-artifact@v4
        with:
          name: books-${{ matrix.device }}
          path: |
            out/${{ matrix.device }}/*.epub
            out/${{ matrix.device }}/*.pdf
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: books
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          # === a hand-run release names its version; gh creates the tag at this commit ===
          TAG: ${{ inputs.release || github.ref_name }}
          BOOKS: ${{ inputs.books }}
        run: |
          notes="Download the EPUB for your device and send it with Send to Kindle, or copy the PDF over USB. See the README for which file fits your e-reader."
          if [ -n "$BOOKS" ]; then
            # === a partial release points readers to the last release for the books it leaves out ===
            previous=$(gh release list --repo "${{ github.repository }}" --limit 1 --json tagName --jq '.[0].tagName')
            notes="This release updates only these books: $BOOKS. The other books are unchanged; download them from [$previous](https://github.com/${{ github.repository }}/releases/tag/$previous).

          $notes"
          fi
          gh release create "$TAG" books/* \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Madinah Mushaf for e-readers $TAG" \
            --notes "$notes"
